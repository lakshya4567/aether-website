<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Aware Presentation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            width: 610px;
            max-width: 100%;
            text-align: center;
        }

        iframe {
            width: 100%;
            height: 515px;
            border: 1px solid #CCC;
            background: #fff;
        }

        .controls {
            margin-top: 10px;
        }

        .fullscreen-btn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .fullscreen-btn:hover {
            background-color: #0056b3;
        }

        /* Fullscreen styles for the container */
        .container:fullscreen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .container:fullscreen iframe {
            width: 100vw;
            height: calc(100vh - 60px);
            border: none;
        }

        .container:fullscreen .controls {
            margin-top: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container" id="presentationContainer">
    <iframe src="https://www.slideshare.net/slideshow/embed_code/key/sdB6rfmBS3KQQU" 
            frameborder="0" 
            marginwidth="0" 
            marginheight="0" 
            scrolling="no" 
            allowfullscreen>
    </iframe>
    
    <div class="controls">
        <button class="fullscreen-btn" onclick="toggleFullscreen()">View Fullscreen</button>
    </div>
</div>

<script>
    function toggleFullscreen() {
        const container = document.getElementById('presentationContainer');
        const button = document.querySelector('.fullscreen-btn');
        
        if (!document.fullscreenElement) {
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.mozRequestFullScreen) { /* Firefox */
                container.mozRequestFullScreen();
            } else if (container.webkitRequestFullscreen) { /* Chrome, Safari and Opera */
                container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) { /* IE/Edge */
                container.msRequestFullscreen();
            }
            button.textContent = "Exit Fullscreen";
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
            button.textContent = "View Fullscreen";
        }
    }

    // Update button text if user exits fullscreen via ESC key
    document.addEventListener('fullscreenchange', () => {
        const button = document.querySelector('.fullscreen-btn');
        if (!document.fullscreenElement) {
            button.textContent = "View Fullscreen";
        }
    });
</script>

</body>
</html>
