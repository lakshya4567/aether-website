<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Cloud Storage</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0d1117;
      color: #c9d1d9;
    }
    h1, h2 { color: #f0f6fc; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    input[type="text"], input[type="password"], input[type="file"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #f0f6fc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #2ea043; }
    ul { list-style: none; padding: 0; }
    li {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #30363d;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .status { margin-top: 10px; font-size: 0.9em; }
  </style>
</head>
<body>

  <h1>Aether Storage</h1>

  <div class="card">
    <h2>1. Access Token</h2>
    <input type="password" id="token" placeholder="Paste GitHub Fine-Grained Token or PAT">
    <button onclick="saveToken()">Save Token</button>
  </div>

  <div class="card">
    <h2>2. Upload File</h2>
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>
    <div id="uploadStatus" class="status"></div>
  </div>

  <div class="card">
    <h2>3. Stored Files</h2>
    <button onclick="fetchFiles()">Refresh File List</button>
    <ul id="fileList"></ul>
  </div>

  <script>
    const REPO_OWNER = 'lakshya4567';
    const REPO_NAME = 'aether-website';
    const FOLDER_PATH = 'downloads/files'; // Subfolder where uploaded files will live

    // Load saved token on startup
    document.getElementById('token').value = localStorage.getItem('gh_token') || '';

    function saveToken() {
      const token = document.getElementById('token').value;
      localStorage.setItem('gh_token', token);
      alert('Token saved locally!');
      fetchFiles();
    }

    function getToken() {
      return localStorage.getItem('gh_token');
    }

    // Fetch list of files in the downloads/files directory
    async function fetchFiles() {
      const fileList = document.getElementById('fileList');
      fileList.innerHTML = 'Loading...';

      try {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FOLDER_PATH}`);
        if (!response.ok) throw new Error('No files found or invalid repository path.');

        const data = await response.json();
        fileList.innerHTML = '';

        data.forEach(file => {
          if (file.type === 'file') {
            const li = document.createElement('li');
            li.innerHTML = `
              <span>${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>
              <a href="${file.download_url}" download target="_blank">Download</a>
            `;
            fileList.appendChild(li);
          }
        });
      } catch (err) {
        fileList.innerHTML = `<li>${err.message}</li>`;
      }
    }

    // Upload selected file to GitHub
    async function uploadFile() {
      const token = getToken();
      if (!token) {
        alert('Please enter and save a GitHub Personal Access Token first.');
        return;
      }

      const fileInput = document.getElementById('fileInput');
      const status = document.getElementById('uploadStatus');

      if (!fileInput.files.length) {
        alert('Please select a file to upload.');
        return;
      }

      const file = fileInput.files[0];
      status.innerText = 'Uploading...';

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = async function () {
        // Extract base64 payload from data URL
        const base64Content = reader.result.split(',')[1];
        const filePath = `${FOLDER_PATH}/${file.name}`;

        try {
          const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Upload ${file.name} via Aether Web Interface`,
              content: base64Content
            })
          });

          if (response.ok) {
            status.innerText = 'Upload successful!';
            fileInput.value = '';
            fetchFiles();
          } else {
            const errorData = await response.json();
            status.innerText = `Upload failed: ${errorData.message}`;
          }
        } catch (err) {
          status.innerText = `Error: ${err.message}`;
        }
      };
    }

    // Load initial file list if directory exists
    fetchFiles();
  </script>
</body>
</html>
